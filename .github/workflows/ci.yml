name: continuous-integration

on:
  push:
    branches:
    - main
    - release*
    tags:
    - v1.*
    - v2.*
  pull_request:
    branches:
    - main
    - release*

permissions:
  contents: read

# Superseded runs on a pull request are pointless work; the org runner pool is
# shared, so cancel them. Every other run gets a group of its own (keyed on the
# run id): a shared group would still let a newer push replace a pending one,
# and pushes to main/release branches and tags must each get their own run, as
# that is the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  E2E_SETUP_KIND: yes
  E2E_SETUP_KUBECTL: yes
  SUDO: sudo
  GOLANGCI_LINT_VERSION: "v2.13.2"

# setup-go's own caching is off in every job below. It derives a single cache
# key from OS + Go version + go.sum, so all jobs here collide on it: they start
# together, all miss, all race to save, and one arbitrary winner takes the slot
# - often a job that barely populates GOCACHE, which the rest then restore. The
# steps below split the two caches:
# - GOMODCACHE is keyed on go.sum, so its contents are fixed by the key.
#   Only ci-validate-go-modules saves it: `go mod tidy` there walks the whole
#   module graph, so the entry is complete. Every other job just restores it;
#   were they all to save, the first job to finish would win the key with
#   whatever subset of modules it happened to download.
# - GOCACHE is saved per job, and per commit: actions/cache never re-saves on
#   an exact key hit, so a key fixed by go.sum alone would freeze the build
#   cache at the first commit to use it. restore-keys picks up the most recent
#   entry for the job instead.
# Jobs that compile little enough not to earn a build cache entry take the
# module cache only.
jobs:
  ci-go-lint:
    name: ci-go-lint
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/go-build
          ~/.cache/golangci-lint
        key: gobuild-${{ runner.os }}-lint-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-lint-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-lint-

    - name: Lint
      run: |
        # Installed directly rather than through the upstream install.sh: its
        # checksum lookup greps checksums.txt for the archive name unanchored,
        # which became ambiguous once releases started shipping .sbom.json
        # entries alongside the archives.
        version="${GOLANGCI_LINT_VERSION#v}"
        base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"
        tarball="golangci-lint-${version}-linux-amd64.tar.gz"
        curl -sSfL -o "${tarball}" "${base}/${tarball}"
        curl -sSfL -o checksums.txt "${base}/golangci-lint-${version}-checksums.txt"
        grep -E "  ${tarball}$" checksums.txt | sha256sum -c -
        tar -xzf "${tarball}"
        install -D "golangci-lint-${version}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"
        rm -rf "${tarball}" "golangci-lint-${version}-linux-amd64" checksums.txt
        make lint

  ci-validate-manifests:
    name: ci-validate-manifests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Validate generated manifests
      run: |
        make validate-manifests

  ci-validate-go-modules:
    name: ci-validate-go-modules
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Cache Go modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Validate go modules
      run: |
        make validate-modules

  ci-validate-docs:
    name: ci-validate-docs
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-docs-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-docs-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-docs-

    - name: Check that all metrics are documented and templates have no delta
      run: |
        make doccheck

  ci-unit-tests:
    name: ci-unit-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-unit-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-unit-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-unit-

    - name: Unit tests
      run: |
        make test-unit

  ci-rule-tests:
    name: ci-rule-tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code into the Go module directory
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup promtool
        run: |
          make install-promtool

      - name: Rule tests
        run: |
          PROMTOOL_CLI=./promtool make test-rules

  ci-benchmark-tests:
    name: ci-benchmark-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-benchmark-main-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-benchmark-main-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-benchmark-main-

    - name: Benchmark tests
      run: |
        BENCHSTAT_OUTPUT_FILE=result.txt make test-benchmark-compare-main
    - run: |
        echo "Comparison against main branch" >> "$GITHUB_STEP_SUMMARY"
        echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
        cat result.txt >> "$GITHUB_STEP_SUMMARY"
        echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
        cat <<EOL >> "$GITHUB_STEP_SUMMARY"
        <hr />
        The table shows the median and 95% confidence interval (CI) summaries for each benchmark comparing the HEAD and the BASE, and an A/B comparison under "vs base". The last column shows the statistical p-value with ten runs (n=10).
        The last row has the Geometric Mean (geomean) for the given rows in the table.
        Refer to <a href="https://pkg.go.dev/golang.org/x/perf/cmd/benchstat">benchstat's documentation</a> for more help.
        EOL

  ci-benchmark-tests-release:
    name: ci-benchmark-tests-releasebranch
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-benchmark-release-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-benchmark-release-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-benchmark-release-

    - name: Benchmark tests
      run: |
        BENCHSTAT_OUTPUT_FILE=result.txt make test-benchmark-compare-release
    - run: |
        echo "Comparison against previous release tag" >> "$GITHUB_STEP_SUMMARY"
        echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
        cat result.txt >> "$GITHUB_STEP_SUMMARY"
        echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
        cat <<EOL >> "$GITHUB_STEP_SUMMARY"
        <hr />
        The table shows the median and 95% confidence interval (CI) summaries for each benchmark comparing the HEAD and the BASE, and an A/B comparison under "vs base". The last column shows the statistical p-value with ten runs (n=10).
        The last row has the Geometric Mean (geomean) for the given rows in the table.
        Refer to <a href="https://pkg.go.dev/golang.org/x/perf/cmd/benchstat">benchstat's documentation</a> for more help.
        EOL

  ci-build-kube-state-metrics:
    name: ci-build-kube-state-metrics
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-build-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-build-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-build-

    - name: Build
      run: |
        make build

  ci-e2e-tests:
    name: ci-e2e-tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code into the Go module directory
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go 1.x
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: '.go-version'
        cache: false # see the caching note above `jobs`
      id: go

    - name: Restore Go modules
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/go/pkg/mod
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum', '.go-version') }}
        restore-keys: gomod-${{ runner.os }}-

    - name: Cache Go build output
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/go-build
        key: gobuild-${{ runner.os }}-e2e-${{ hashFiles('go.sum', '.go-version') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-e2e-${{ hashFiles('go.sum', '.go-version') }}-
          gobuild-${{ runner.os }}-e2e-

    - name: End-to-end tests
      run: |
        make e2e
